name: KobeanQAUtils
options:
  bundleIdPrefix: com.kobenguyent
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ALWAYS_SEARCH_USER_PATHS: NO
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:
  KobeanQAUtils:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/KobeanQAUtils
      - path: Resources
    info:
      path: Resources/Info.plist
    entitlements:
      path: Resources/KobeanQAUtils.entitlements
    settings:
      base:
        PRODUCT_NAME: KobeanQAUtils
        PRODUCT_BUNDLE_IDENTIFIER: com.kobenguyent.kobeanqautils
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/KobeanQAUtils.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        COMBINE_HIDPI_IMAGES: YES
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "1"
